name: Release Image

# Builds the image from the tags in versions.env. Every push and pull request
# checks that it builds; a v* tag also publishes it.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the compose files
        run: |
          cp .env.example .env
          sed -i 's/^UI_DB_PASSWORD=$/UI_DB_PASSWORD=ci/; s/^UI_SESSION_SECRET=$/UI_SESSION_SECRET=ci/' .env
          docker compose -f compose.yml config -q
          ZIGBEE_ADAPTER=/dev/null docker compose -f compose.yml -f compose.zigbee.yml config -q
          COMPOSE_PROFILES=agent docker compose -f compose.yml config -q
          rm .env

      - name: Build from versions.env
        run: ./build.sh --tag slidebolt:ci

      - name: Check the image
        run: |
          docker run --rm --entrypoint /bin/sh slidebolt:ci -euc '
            for b in sb-messenger sb-storage sb-logging sb-api sb-script sb-virtual sb-media sb-speech \
                     asterisk-host plugin-asterisk plugin-opencode plugin-zigbee plugin-automation \
                     plugin-esphome plugin-wiz plugin-kasa plugin-homeassistant plugin-alexa; do
              test -x /app/.bin.image/$b || { echo "missing $b"; exit 1; }
            done
            test -x /usr/local/bin/sb-manager
            test -x /usr/local/bin/sb
            test -x /usr/local/bin/whisper-cli
            test -x /usr/local/bin/piper
            test -f /app/zigbee-host/dist/host.js
            test -f /app/ui/apps/api/dist/index.js
            test -f /usr/share/nginx/html/index.html
            grep -q "\"mode\":\"tags\"" /app/build-manifest.json
          '

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for t in "${GITHUB_REF_NAME}" latest; do
            docker tag slidebolt:ci "ghcr.io/slidebolt/release:$t"
            docker push "ghcr.io/slidebolt/release:$t"
          done
