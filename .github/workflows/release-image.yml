name: Release Image

# Builds the image from the tags in versions.env. Final publication is owned by
# the standalone slidebolt-ci promotion job after its end-to-end proof.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check the compose files
        run: |
          cp .env.example .env
          sed -i 's/^UI_DB_PASSWORD=$/UI_DB_PASSWORD=ci/; s/^UI_SESSION_SECRET=$/UI_SESSION_SECRET=ci/' .env
          docker compose -f compose.yml config -q
          docker compose -f compose.yml -f compose.speech.yml config -q
          ZIGBEE_ADAPTER=/dev/null docker compose -f compose.yml -f compose.zigbee.yml config -q
          COMPOSE_PROFILES=agent docker compose -f compose.yml config -q
          rm .env

      - name: Build from versions.env
        run: ./build.sh --tag slidebolt:ci

      - name: Check the image
        run: |
          docker run --rm --entrypoint /bin/sh slidebolt:ci -euc '
            for b in sb-messenger sb-storage sb-logging sb-api sb-script sb-virtual sb-media sb-speech \
                     asterisk-host plugin-asterisk plugin-opencode plugin-zigbee plugin-zigbee2mqtt \
                     plugin-androidtv plugin-frigate plugin-jellyfin plugin-automation \
                     plugin-esphome plugin-wiz plugin-kasa plugin-homeassistant plugin-alexa; do
              test -x /app/.bin.image/$b || { echo "missing $b"; exit 1; }
            done
            test -x /usr/local/bin/sb-manager
            test -x /usr/local/bin/sb
            ! command -v whisper-cli
            ! command -v whisper-server
            ! command -v piper
            test ! -d /app/models
            test -f /app/zigbee-host/dist/host.js
            test -f /app/ui/apps/api/dist/index.js
            test -f /usr/share/nginx/html/index.html
            nginx -t
            grep -q "location = /openapi.json" /etc/nginx/http.d/default.conf
            grep -q "location = /openapi.yaml" /etc/nginx/http.d/default.conf
            grep -q "\"mode\":\"tags\"" /app/build-manifest.json
          '

  quickstart-catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/catalog/go.mod
      - name: Generate catalog from released component contracts
        working-directory: tools/catalog
        run: go test ./...
      - name: Generate released catalog
        working-directory: tools/catalog
        run: go run . --manifest ../../quickstart-components.json --versions ../../versions.env --output ../../quickstart-catalog.json --release "${GITHUB_REF_NAME:-development}"
