server {
    listen 49101;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Generated reference material is public. The authenticated Core API stays
    # on loopback until client discovery and pairing are released.
    location = /openapi.json {
        proxy_pass http://127.0.0.1:29011/openapi.json;
        proxy_set_header Host $host;
    }

    # Huma's generated /docs page loads the YAML representation.
    location = /openapi.yaml {
        proxy_pass http://127.0.0.1:29011/openapi.yaml;
        proxy_set_header Host $host;
    }

    location = /docs {
        proxy_pass http://127.0.0.1:29011/docs;
        proxy_set_header Host $host;
    }

    location /schemas/ {
        proxy_pass http://127.0.0.1:29011/schemas/;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:40001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Paired clients use the same trusted HTTPS origin as the web console.
    # The Core API itself remains bound to host loopback; authentication is
    # still enforced by sb-api on every non-public route.
    location /core/ {
        proxy_pass http://127.0.0.1:29011/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
