; Calls from your phones' context. 4000 is answered by SlideBolt; the arguments
; tell asterisk-host which service was dialed.
[from-internal]
exten => 4000,1,NoOp(SlideBolt agent line)
 same => n,Stasis(slidebolt,service,4000)
 same => n,Hangup()

; Text messages (SIP MESSAGE). SlideBolt sees texts through its ARI endpoint
; subscription; this context only delivers texts between phones.
; One priority per rule, and no Hangup(): see README.md.
[messages-internal]
exten => 4000,1,NoOp(SlideBolt service number)
exten => _X.,1,MessageSend(pjsip:${EXTEN},${MESSAGE(from)})
